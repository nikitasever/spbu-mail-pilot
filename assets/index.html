<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
  <link rel="stylesheet" href="app.css">
  <title>Почта · тест</title>
</head>
<body>
<div id="mail-v2">
 <section class="mobile">
  <header class="top"><div class="account"><i data-lucide="mail" aria-hidden="true"></i><span>Рабочая почта</span><span class="demo">Тест 0.30</span></div><div class="titlebar"><details class="folder-menu"><summary class="cursor-interaction" aria-label="Разделы приложения"><i data-lucide="menu" aria-hidden="true"></i></summary><div class="folder-list" id="menu"></div></details><h2 id="heading">Входящие</h2><div class="header-actions"><button type="button" data-action="refresh" aria-label="Обновить почту"><i data-lucide="refresh-cw" aria-hidden="true"></i></button></div></div><button id="account-label" type="button" class="account-switch" data-action="switch-account" aria-label="Сменить почтовый аккаунт"></button></header>
  <div id="status" role="status" aria-live="polite"></div>
  <main id="main"></main>
  <nav class="bottom" aria-label="Основные разделы"><button data-route="mail" type="button"><i data-lucide="mail" aria-hidden="true"></i><span>Почта</span></button><button data-route="calendar" type="button"><i data-lucide="calendar-days" aria-hidden="true"></i><span>Календарь</span></button><button data-route="tasks" type="button"><i data-lucide="list-checks" aria-hidden="true"></i><span>Задачи <span id="count"></span></span></button></nav>
 </section>
</div>
<script src="lucide.min.js"></script>
<script src="app.js"></script>
</body>
</html>
