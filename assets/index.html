<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
  <link rel="stylesheet" href="app.css">
  <title>Почта · тест</title>
</head>
<body>
<div id="mail-v2">
 <section class="mobile">
  <header class="top"><div class="reader-top" id="reader-top"></div><div class="account"><i data-lucide="mail" aria-hidden="true"></i><span>Рабочая почта</span><span class="demo">Тест 0.61</span></div><div class="titlebar"><details class="folder-menu"><summary class="cursor-interaction" aria-label="Разделы приложения"><i data-lucide="menu" aria-hidden="true"></i></summary></details><button type="button" id="folder-title" data-action="choose-mail-folder" aria-label="Выбрать папку"><h2 id="heading">Входящие</h2><span id="folder-title-arrow" aria-hidden="true">⌄</span></button><div class="header-actions"><button type="button" data-action="global-search" aria-label="Поиск по почте, календарю и контактам"><i data-lucide="search" aria-hidden="true"></i></button><button type="button" data-action="refresh" aria-label="Обновить почту"><i data-lucide="refresh-cw" aria-hidden="true"></i></button></div></div><div class="header-meta"><button id="account-label" type="button" class="account-switch" data-action="switch-account" aria-label="Сменить почтовый аккаунт"></button><div id="inbox-context"></div></div></header>
  <div id="status" role="status" aria-live="polite"></div>
  <main id="main"></main>
  <dialog id="app-drawer" aria-labelledby="drawer-title"><div class="drawer-head"><div><h3 id="drawer-title">Рабочая почта</h3><small id="drawer-account"></small></div><button type="button" data-action="close-drawer" aria-label="Закрыть меню">×</button></div><div class="folder-list" id="menu"></div><div class="drawer-footer" id="drawer-footer"></div></dialog>
  <nav class="bottom" aria-label="Основные разделы"><button data-route="mail" type="button"><i data-lucide="mail" aria-hidden="true"></i><span>Почта</span></button><button data-route="calendar" type="button"><i data-lucide="calendar-days" aria-hidden="true"></i><span>Календарь</span></button><button data-route="tasks" type="button"><i data-lucide="list-checks" aria-hidden="true"></i><span>Задачи <span id="count"></span></span></button></nav>
 </section>
</div>
<script src="lucide.min.js"></script>
<script src="app.js"></script>
</body>
</html>
