name: Compose Gemini proxy candidate
on:
  workflow_dispatch:
    inputs:
      stage_only:
        description: Transfer the already signed Gemini proxy candidate to its isolated updates branch
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    if: ${{ !inputs.stage_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;35.0.0'
      - name: Locked JVM dependencies
        run: python -c 'import build; build.dependencies()'
      - name: Calendar domain regression checks
        run: |
          mkdir -p build/calendar-tests
          javac -cp lib/json-test-20240303.jar -d build/calendar-tests native-ui/app/src/main/java/ru/local/spbumailpilot/NativeAgenda.java native-ui/tests/NativeAgendaTest.java
          java -cp build/calendar-tests:lib/json-test-20240303.jar ru.local.spbumailpilot.NativeAgendaTest
          javac -cp lib/json-test-20240303.jar -d build/calendar-tests native-ui/app/src/main/java/ru/local/spbumailpilot/NativeCalendarVisibility.java native-ui/tests/NativeCalendarVisibilityTest.java
          java -cp build/calendar-tests:lib/json-test-20240303.jar ru.local.spbumailpilot.NativeCalendarVisibilityTest
          javac -cp lib/json-test-20240303.jar -d build/calendar-tests src/ru/local/spbumailpilot/{GeminiDigest,AiConfiguration,DigestBatch}.java tests/GeminiDigestTest.java
          java -cp build/calendar-tests:lib/json-test-20240303.jar ru.local.spbumailpilot.GeminiDigestTest
      - name: Background notification regression checks
        run: python3 tools/test-notifications.py
      - name: Local EML and attachment regression checks
        run: python3 tools/test-local-attachments.py
      - name: Private proxy TLS and cancellation fixtures
        run: python3 tools/test-gemini-proxy.py
      - name: Compile, verify themes and package Compose
        working-directory: native-ui
        run: >-
          ./gradlew --no-daemon -PrenderUi -PnativeVersionCode=97 -PnativeVersionName=0.74-native.8
          :app:assembleRelease :app:testDebugUnitTest
          --tests '*.NativeAppearanceTest' --tests '*.NativeDigestPrivacyTest'
      - name: Sign with existing project key
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          mkdir -p build
          python - <<'PYTHON'
          import base64, os, pathlib
          key=pathlib.Path('build/signing.keystore')
          key.write_bytes(base64.b64decode(os.environ['APK_KEYSTORE_BASE64'],validate=True))
          key.chmod(0o600)
          PYTHON
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/zipalign" -f -p 4 native-ui/app/build/outputs/apk/release/app-release-unsigned.apk build/aligned.apk
          "$TOOLS/apksigner" sign --ks build/signing.keystore --ks-key-alias pilot --ks-pass env:APK_STORE_PASSWORD --key-pass env:APK_KEY_PASSWORD --out build/spbu-mail-pilot-0.74-native.8.apk build/aligned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs build/spbu-mail-pilot-0.74-native.8.apk
          cd build
          sha256sum spbu-mail-pilot-0.74-native.8.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compose-gemini-proxy-signed
          path: |
            build/spbu-mail-pilot-0.74-native.8.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f build/signing.keystore

  stage-candidate:
    if: ${{ inputs.stage_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Verification tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Download already signed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40384551956 --repo nikitasever/spbu-mail-pilot --name compose-gemini-proxy-signed --dir candidate
          gh run view 40384551956 --repo nikitasever/spbu-mail-pilot --json headSha --jq .headSha > candidate/source-commit.txt
          cd candidate
          sha256sum -c SHA256SUMS.txt
      - name: Verify identity and stage in isolated updates branch
        env:
          UPDATE_DEPLOY_KEY: ${{ secrets.UPDATE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_DEPLOY_KEY"
          umask 077
          python3 - <<'PYTHON'
          import os,pathlib
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'update-deploy-key'
          key.write_text(os.environ['UPDATE_DEPLOY_KEY'].replace('\r','').strip()+'\n')
          key.chmod(0o600)
          PYTHON
          ssh-keyscan github.com > "$RUNNER_TEMP/update-known-hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/update-deploy-key -o UserKnownHostsFile=$RUNNER_TEMP/update-known-hosts -o StrictHostKeyChecking=yes"
          git clone --single-branch --branch codex/compose-gemini-proxy-0.74-native.8 git@github.com:nikitasever/spbu-mail-pilot-updates.git updates
          python3 - <<'PYTHON'
          import hashlib,json,os,pathlib,shutil,subprocess
          apk=pathlib.Path('candidate/spbu-mail-pilot-0.74-native.8.apk')
          tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          verified=subprocess.check_output([str(tools/'apksigner'),'verify','--verbose','--print-certs',str(apk)],text=True)
          cert='197ecdabd94c7217afa45df6f02300f1f0ff12474b3146fc4018a3adbb8ce7b6'
          assert cert in verified, 'Unexpected signing certificate'
          badging=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)
          assert "package: name='ru.local.spbumailpilot' versionCode='97' versionName='0.74-native.8'" in badging, 'Unexpected APK version'
          target=pathlib.Path('updates/candidates/0.74-native.8')
          assert (target/'release-notes.md').is_file()
          shutil.copyfile(apk,target/apk.name)
          info=dict(packageId='ru.local.spbumailpilot',versionName='0.74-native.8',versionCode=97,certificateSha256=cert,sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),sourceCommit=pathlib.Path('candidate/source-commit.txt').read_text().strip(),buildRun=40384551956,sizeBytes=apk.stat().st_size)
          (target/'build-info.json').write_text(json.dumps(info,indent=2)+'\n')
          files=[apk.name,'spbu-mail-pilot-0.74-native.8-source.zip']
          (target/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256((target/n).read_bytes()).hexdigest()+'  '+n+'\n' for n in files))
          print(verified)
          print(json.dumps(info,indent=2))
          PYTHON
          cd updates
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidates/0.74-native.8
          git commit -m 'Stage verified signed Compose appearance candidate'
          git push origin HEAD:refs/heads/codex/compose-gemini-proxy-0.74-native.8
      - name: Remove deployment key
        if: always()
        run: rm -f "$RUNNER_TEMP/update-deploy-key"
