name: Android cloud build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compose_candidate:
        description: Build and publish the signed Compose prerelease (no update-channel promotion)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-main
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !inputs.compose_candidate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Android tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;35.0.0'
      - name: Restore signing key
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          python -c "import os,base64,pathlib; pathlib.Path('build').mkdir(exist_ok=True); pathlib.Path('build/signing.keystore').write_bytes(base64.b64decode(os.environ['APK_KEYSTORE_BASE64']))"
      - name: Test and build signed APK
        env:
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: pilot
        run: python build.py --test --keystore build/signing.keystore
      - name: Browser layout checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:layout
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-apk
          path: build/spbu-mail-pilot.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish update channel
        env:
          UPDATE_DEPLOY_KEY: ${{ secrets.UPDATE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python cloud_publish.py
      - name: Remove signing material
        if: always()
        run: rm -f build/signing.keystore

  compose-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compose_candidate }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;35.0.0'
      - name: Legacy compatibility checks
        run: python build.py --test --check-only
      - name: Native host checks
        run: |
          bash native-ui/test-compose.sh
          bash native-ui/test-global-search.sh
          bash native-ui/test-reader-actions.sh
          bash native-ui/test-file-library.sh
      - name: Native tests and release packaging
        working-directory: native-ui
        run: >-
          ./gradlew --no-daemon -PrenderUi -PcandidateRelease
          :app:assembleRelease :app:testDebugUnitTest
          --tests '*.NativeCalendarLinksTest' --tests '*.NativeReaderDetailsTest'
          --tests '*.NativeThreadNavigationTest' --tests '*.NativeAccountsStorageTest'
          --tests '*.NativeNavigationTest' --tests '*.NativeStartupTest'
          --tests '*.NativeInboxThreadsTest' --tests '*.NativeWatchRefreshTest' --tests '*PrivacyTest'
      - name: Sign and verify with existing application key
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          python - <<'PYTHON'
          import base64, os, pathlib
          key = pathlib.Path('build/signing.keystore')
          key.write_bytes(base64.b64decode(os.environ['APK_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          PYTHON
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/zipalign" -f -p 4 native-ui/app/build/outputs/apk/release/app-release-unsigned.apk build/compose-aligned.apk
          "$TOOLS/apksigner" sign --ks build/signing.keystore --ks-key-alias pilot --ks-pass env:APK_STORE_PASSWORD --key-pass env:APK_KEY_PASSWORD --out build/spbu-mail-pilot-0.74-rc.1.apk build/compose-aligned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs build/spbu-mail-pilot-0.74-rc.1.apk
          cd build
          sha256sum spbu-mail-pilot-0.74-rc.1.apk > spbu-mail-pilot-0.74-rc.1.apk.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compose-candidate-signed
          path: |
            build/spbu-mail-pilot-0.74-rc.1.apk
            build/spbu-mail-pilot-0.74-rc.1.apk.sha256
          if-no-files-found: error
      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.74-rc.1 build/spbu-mail-pilot-0.74-rc.1.apk build/spbu-mail-pilot-0.74-rc.1.apk.sha256 --target "$GITHUB_SHA" --title '0.74-rc.1 — Kotlin + Jetpack Compose' --notes-file release-notes/0.74-rc.1.md --prerelease --latest=false
      - name: Remove signing material
        if: always()
        run: rm -f build/signing.keystore
