name: Compose appearance candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;35.0.0'
      - name: Locked JVM dependencies
        run: python -c 'import build; build.dependencies()'
      - name: Compile, verify themes and package Compose
        working-directory: native-ui
        run: >-
          ./gradlew --no-daemon -PrenderUi -PnativeVersionCode=90 -PnativeVersionName=0.74-native.1
          :app:assembleRelease :app:testDebugUnitTest
          --tests '*.NativeAppearanceTest' --tests '*.NativePreviewTest'
      - name: Sign with existing project key
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          mkdir -p build
          python - <<'PYTHON'
          import base64, os, pathlib
          key=pathlib.Path('build/signing.keystore')
          key.write_bytes(base64.b64decode(os.environ['APK_KEYSTORE_BASE64'],validate=True))
          key.chmod(0o600)
          PYTHON
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/zipalign" -f -p 4 native-ui/app/build/outputs/apk/release/app-release-unsigned.apk build/aligned.apk
          "$TOOLS/apksigner" sign --ks build/signing.keystore --ks-key-alias pilot --ks-pass env:APK_STORE_PASSWORD --key-pass env:APK_KEY_PASSWORD --out build/spbu-mail-pilot-0.74-native.1.apk build/aligned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs build/spbu-mail-pilot-0.74-native.1.apk
          cd build
          sha256sum spbu-mail-pilot-0.74-native.1.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compose-appearance-signed
          path: |
            build/spbu-mail-pilot-0.74-native.1.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f build/signing.keystore
